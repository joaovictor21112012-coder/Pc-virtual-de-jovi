name: Kali Linux Turbo (Docker + KasmVNC)

on:
  workflow_dispatch:

jobs:
  deploy-kali:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Instalar Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} --hostname "kali-turbo-${{ github.run_id }}"

      - name: 2. Instalar Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: 3. Baixar e Iniciar Kali Linux (Oficial Kasm)
        run: |
          # Baixa a imagem oficial do Kali com XFCE e ferramentas
          sudo docker pull kasmweb/kali-rolling-desktop:latest
          
          # Inicia o container
          # A senha de acesso será "P@ssw0rd!"
          # A porta 6901 é a porta padrão do KasmVNC
          sudo docker run -d --name kali -p 6901:6901 -e VNC_PW=P@ssw0rd! kasmweb/kali-rolling-desktop:latest
          
          echo "Kali Linux iniciado com sucesso no Docker!"

      - name: 4. Obter IP e Detalhes
        run: |
          TAILSCALE_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV
          
          echo "====================================================="
          echo "        KALI LINUX TURBO - PRONTO PARA USO            "
          echo "====================================================="
          echo "IP do Tailscale: $TAILSCALE_IP"
          echo "Senha do VNC: P@ssw0rd!"
          echo ""
          echo "--- COMO ACESSAR ---"
          echo "1. Certifique-se de que seu celular/PC está conectado à sua rede Tailscale."
          echo "2. Abra o navegador e acesse: https://$TAILSCALE_IP:6901"
          echo "3. Ignore o aviso de 'Site não seguro' (é um certificado autoassinado)."
          echo "4. Clique em 'Connect' e insira a senha: P@ssw0rd!"
          echo "====================================================="

      - name: 5. Manter Sessão Ativa
        run: |
          echo "Mantendo a máquina ligada por até 6 horas..."
          while true; do
            sleep 60
            echo "Sessão ativa: $(date)"
            # Verifica se o Docker ainda está rodando
            if ! sudo docker ps | grep -q "kali"; then
              echo "Docker caiu. Reiniciando..."
              sudo docker start kali
            fi
            # Verifica Tailscale
            if ! tailscale status | grep -q "active"; then
              echo "Tailscale caiu. Reiniciando..."
              sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} --hostname "kali-turbo-${{ github.run_id }}"
            fi
          done
